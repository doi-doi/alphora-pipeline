[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alphora-pipeline"
version = "0.1.0"
description = "Configurable endpoint research, walk-forward selection and robustness reports"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "polars>=1.0,<2", "pyarrow>=20", "python-dotenv>=1.0,<2", "plotly>=6,<7"]

[project.optional-dependencies]
live = ["adrs>=1.13.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
alphora = "alphora_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"
